<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상훈 콜렉터 - 캐치조상훈 (Final Version)</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/config.js"></script>
    <script defer src="js/characters.js"></script>
    <script defer src="js/audio.js"></script>
    <script defer src="js/cutscene.js"></script>
    <script defer src="js/main.js"></script>
</head>
<body>
    <div id="portal-overlay">
        <div class="portal-container">
            <div class="portal-ring ring-1"></div>
            <div class="portal-ring ring-2"></div>
            <div class="portal-core"></div>
        </div>
        <h1 id="portal-text">차원 균열 개방 중...</h1>
    </div>

    <div id="ending-overlay">
        <div id="bg-sweep"></div>
        <div id="god-rays"></div>

        <div id="shake-container">
            <h1 id="ending-text">모든 조각이 모여...<br>진정한 형태를 이룹니다.</h1>
            <div id="silhouette-card"></div>
            <div id="ur-reveal-container"></div>
        </div>

        <p id="ending-hint">화면을 클릭하여 닫기</p>
    </div>

    <div id="global-dim"></div>
    <div id="flash-overlay"></div>

    <div id="zoom-overlay">
        <div id="zoomed-card-container" class="zoomed-card-wrapper"></div>
        <div class="close-zoom-text">빈 공간을 클릭하여 닫기</div>
    </div>

    <div id="main-container">
        <div class="game-box" id="game-box">
            <button id="skip-btn">연출 스킵 >> </button>
            <button id="close-btn">결과 닫기 X</button>

            <h1 style="text-align: center; color: var(--sr-color); margin: 0 0 15px 0;">⚡ 캐치조상훈! - 나만의 상훈 콜렉션 ⚡</h1>
            <div id="display-area" class="single-mode">
                <p style="color: #555;">소환 대기 중...</p>
            </div>
            <div id="control-panel" style="display: flex; gap: 15px; margin-top: 20px;">
                <button id="btn1">단일 소환</button>
                <button id="btn5">5연속 소환</button>
                <button id="btn10">
                    10연속 소환<br>
                    <span class="chance-up-badge">★확률 UP!★</span>
                </button>
            </div>
        </div>
    </div>

    <div id="collection-container">
        <h2 style="margin: 0 0 15px 0;">📚 도감 (<span id="count-val">0</span>/<span id="total-count">0</span>)</h2>
        <div id="collection-grid" class="collection-grid"></div>
    </div>

    <div id="credit-watermark">made by 이상준</div>
</body>
</html>
